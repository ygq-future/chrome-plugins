<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 划词翻译</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0d1117;
      color: #e2e8f0;
      font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .hd {
      display: flex; align-items: center; gap: 11px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(99,179,237,0.05) 0%, transparent 100%);
    }
    .hd-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #63b3ed, #3182ce);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: white;
      box-shadow: 0 3px 10px rgba(99,179,237,0.35); flex-shrink: 0;
    }
    .hd-info h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .hd-info p  { font-size: 11px; color: #718096; margin-top: 2px; }
    .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field > label {
      font-size: 11px; font-weight: 600; color: #718096;
      display: flex; align-items: center; gap: 5px;
    }
    .badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      padding: 1px 5px; border-radius: 4px;
      background: rgba(104,211,145,0.12); color: #68d391;
      border: 1px solid rgba(104,211,145,0.2);
    }
    input, select {
      background: #161b27; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 9px 11px; color: #e2e8f0;
      font-size: 12px; font-family: 'SF Mono','Fira Mono',monospace;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    }
    input::placeholder { color: #2d3748; font-family: inherit; }
    input:focus, select:focus {
      border-color: rgba(99,179,237,0.5);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.08);
    }
    select option { background: #1a1f2e; }
    .hint { font-size: 10px; color: #2d3748; padding-left: 1px; line-height: 1.4; }
    .preset-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .preset-btn {
      font-size: 10px; font-weight: 600; padding: 4px 9px;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
      background: #161b27; color: #718096; cursor: pointer;
      transition: all 0.12s; font-family: inherit;
    }
    .preset-btn:hover {
      border-color: rgba(99,179,237,0.4); color: #90cdf4;
      background: rgba(99,179,237,0.06);
    }
    .divider { height: 1px; background: rgba(255,255,255,0.05); }
    .radio-group { display: flex; flex-direction: column; gap: 6px; }
    .radio-opt { display: block; cursor: pointer; }
    .radio-opt input[type="radio"] { display: none; }
    .radio-box {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: #161b27;
      border: 1px solid rgba(255,255,255,0.07); border-radius: 9px;
      transition: border-color 0.15s, background 0.15s;
    }
    .radio-opt:hover .radio-box {
      border-color: rgba(99,179,237,0.25); background: #1a2030;
    }
    .radio-opt input:checked + .radio-box {
      border-color: rgba(99,179,237,0.5); background: rgba(99,179,237,0.06);
    }
    .radio-icon {
      width: 26px; height: 26px; background: rgba(255,255,255,0.05);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #4a5568; flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .radio-opt input:checked + .radio-box .radio-icon {
      background: rgba(99,179,237,0.15); color: #90cdf4;
    }
    .radio-text { display: flex; flex-direction: column; gap: 1px; }
    .radio-text strong { font-size: 12px; font-weight: 600; color: #c5d0e0; }
    .radio-text em { font-size: 10px; color: #4a5568; font-style: normal; }
    .radio-opt input:checked + .radio-box .radio-text strong { color: #90cdf4; }
    .btn-save {
      padding: 10px; background: linear-gradient(135deg, #2b6cb0, #2c5282);
      border: none; border-radius: 9px; color: #fff; font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
      transition: opacity 0.15s, transform 0.12s; letter-spacing: 0.2px;
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-save:active { transform: none; }
    .toast {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1a2436; border: 1px solid rgba(99,179,237,0.3);
      border-radius: 999px; padding: 7px 16px;
      font-size: 12px; color: #68d391;
      opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="hd">
  <div class="hd-logo">AI</div>
  <div class="hd-info">
    <h1>AI 划词翻译</h1>
    <p>OpenAI 兼容接口 · 自定义配置</p>
  </div>
</div>

<div class="bd">

  <div class="field">
    <label>API 地址 <span class="badge">BASE URL</span></label>
    <input type="text" id="apiBase" placeholder="https://api.openai.com" />
    <div class="hint">支持任意 OpenAI 兼容接口，留空使用 OpenAI 官方地址</div>
    <div class="preset-row">
      <button class="preset-btn" data-url="https://api.openai.com" data-model="gpt-4o-mini">OpenAI</button>
      <button class="preset-btn" data-url="https://api.deepseek.com" data-model="deepseek-chat">DeepSeek</button>
      <button class="preset-btn" data-url="https://api.groq.com/openai" data-model="llama-3.3-70b-versatile">Groq</button>
      <button class="preset-btn" data-url="https://generativelanguage.googleapis.com/v1beta/openai" data-model="gemini-2.0-flash">Gemini</button>
    </div>
  </div>

  <div class="field">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
  </div>

  <div class="field">
    <label>模型名称</label>
    <input type="text" id="model" placeholder="gpt-4o-mini" />
    <div class="hint">填入模型 ID，如 gpt-4o-mini · deepseek-chat · qwen-plus 等</div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>翻译窗口关闭方式</label>
    <div class="radio-group">
      <label class="radio-opt">
        <input type="radio" name="dismissMode" value="scroll" />
        <span class="radio-box">
          <span class="radio-icon">↕</span>
          <span class="radio-text">
            <strong>滚动即关闭</strong>
            <em>页面滚动时自动关闭翻译窗口</em>
          </span>
        </span>
      </label>
      <label class="radio-opt">
        <input type="radio" name="dismissMode" value="click" />
        <span class="radio-box">
          <span class="radio-icon">✕</span>
          <span class="radio-text">
            <strong>点击其他处关闭</strong>
            <em>滚动时保持翻译窗口，点击空白处才关闭</em>
          </span>
        </span>
      </label>
    </div>
  </div>

  <div class="field">
    <label>翻译目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">🇨🇳 简体中文</option>
      <option value="zh-TW">🇹🇼 繁体中文</option>
      <option value="en">🇺🇸 英语</option>
      <option value="ja">🇯🇵 日语</option>
      <option value="ko">🇰🇷 韩语</option>
      <option value="fr">🇫🇷 法语</option>
      <option value="de">🇩🇪 德语</option>
      <option value="es">🇪🇸 西班牙语</option>
    </select>
  </div>

  <button class="btn-save" id="btn-save">保存设置</button>

</div>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
