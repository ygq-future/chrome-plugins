<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 划词翻译</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0d1117; }
    body {
      width: 340px;
      max-height: 580px;
      overflow-y: auto;
      border-radius: 14px;
      background: #0d1117;
      color: #e2e8f0;
      font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    /* 自定义滚动条 */
    body { scrollbar-width: thin; scrollbar-color: rgba(99,179,237,0.3) transparent; }
    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb {
      background: rgba(99,179,237,0.28); border-radius: 8px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    body::-webkit-scrollbar-thumb:hover {
      background: rgba(99,179,237,0.5); background-clip: padding-box;
    }
    .hd {
      display: flex; align-items: center; gap: 11px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(99,179,237,0.05) 0%, transparent 100%);
    }
    .hd-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #63b3ed, #3182ce);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: white;
      box-shadow: 0 3px 10px rgba(99,179,237,0.35); flex-shrink: 0;
    }
    .hd-info h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .hd-info p  { font-size: 11px; color: #718096; margin-top: 2px; }
    .hd-status {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: #68d391;
      background: rgba(104,211,145,0.12);
      border: 1px solid rgba(104,211,145,0.25);
      padding: 2px 7px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .hd-status.show { opacity: 1; }
    .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .field > label, .field-label-row > label {
      font-size: 11px; font-weight: 600; color: #718096;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-fetch-models {
      font-size: 10px;
      font-weight: 600;
      color: #90cdf4;
      background: rgba(99, 179, 237, 0.1);
      border: 1px solid rgba(99, 179, 237, 0.25);
      border-radius: 6px;
      padding: 2px 7px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-fetch-models:hover:not(:disabled) {
      background: rgba(99, 179, 237, 0.2);
      border-color: rgba(99, 179, 237, 0.45);
      color: #fff;
    }
    .btn-fetch-models:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      padding: 1px 5px; border-radius: 4px;
      background: rgba(104,211,145,0.12); color: #68d391;
      border: 1px solid rgba(104,211,145,0.2);
    }
    input, select {
      background: #161b27; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 9px 11px; color: #e2e8f0;
      font-size: 12px; font-family: 'SF Mono','Fira Mono',monospace;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    }
    input::placeholder { color: #2d3748; font-family: inherit; }
    input:focus, select:focus {
      border-color: rgba(99,179,237,0.5);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.08);
    }
    select option { background: #1a1f2e; }
    .hint { font-size: 10px; color: #2d3748; padding-left: 1px; line-height: 1.4; }
    .link-like { color: #63b3ed; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(99,179,237,0.3); }
    kbd {
      font-size: 10px; font-family: 'SF Mono','Fira Mono',monospace;
      background: #1a1f2e; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px; padding: 1px 5px; color: #718096;
    }
    .panel-launch { display: flex; flex-direction: column; gap: 5px; }
    .panel-launch-row { display: flex; align-items: center; gap: 8px; }
    .btn-panel {
      flex: 1; padding: 9px; background: linear-gradient(135deg, #2b6cb0, #2c5282);
      border: none; border-radius: 9px; color: #fff; font-family: inherit;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.12s; letter-spacing: 0.3px;
    }
    .btn-panel:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-panel:active { transform: none; }
    .shortcut-hint { font-size: 10px; color: #4a5568; white-space: nowrap; }
    .preset-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .preset-btn {
      font-size: 10px; font-weight: 600; padding: 4px 9px;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
      background: #161b27; color: #718096; cursor: pointer;
      transition: all 0.12s; font-family: inherit;
    }
    .preset-btn:hover {
      border-color: rgba(99,179,237,0.4); color: #90cdf4;
      background: rgba(99,179,237,0.06);
    }
    .divider { height: 1px; background: rgba(255,255,255,0.05); }
    .radio-group { display: flex; flex-direction: column; gap: 6px; }
    .radio-opt { display: block; cursor: pointer; }
    .radio-opt input[type="radio"] { display: none; }
    .radio-box {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: #161b27;
      border: 1px solid rgba(255,255,255,0.07); border-radius: 9px;
      transition: border-color 0.15s, background 0.15s;
    }
    .radio-opt:hover .radio-box {
      border-color: rgba(99,179,237,0.25); background: #1a2030;
    }
    .radio-opt input:checked + .radio-box {
      border-color: rgba(99,179,237,0.5); background: rgba(99,179,237,0.06);
    }
    .radio-icon {
      width: 26px; height: 26px; background: rgba(255,255,255,0.05);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #4a5568; flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .radio-opt input:checked + .radio-box .radio-icon {
      background: rgba(99,179,237,0.15); color: #90cdf4;
    }
    .radio-text { display: flex; flex-direction: column; gap: 1px; }
    .radio-text strong { font-size: 12px; font-weight: 600; color: #c5d0e0; }
    .radio-text em { font-size: 10px; color: #4a5568; font-style: normal; }
    .radio-opt input:checked + .radio-box .radio-text strong { color: #90cdf4; }
    .btn-save {
      padding: 10px; background: linear-gradient(135deg, #2b6cb0, #2c5282);
      border: none; border-radius: 9px; color: #fff; font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
      transition: opacity 0.15s, transform 0.12s; letter-spacing: 0.2px;
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-save:active { transform: none; }
    .toast {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1a2436; border: 1px solid rgba(99,179,237,0.3);
      border-radius: 999px; padding: 7px 16px;
      font-size: 12px; color: #68d391;
      opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 自定义下拉框（与翻译面板一致的样式与动画） */
    .ai-select { position: relative; width: 100%; }
    .ai-select-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 6px; background: #161b27; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 9px 11px; color: #e2e8f0; font-size: 12px;
      font-family: inherit; cursor: pointer; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .ai-select-btn:hover { border-color: rgba(99,179,237,0.25); }
    .ai-select.open .ai-select-btn {
      border-color: rgba(99,179,237,0.5);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.08); transform: translateY(-1px);
    }
    .ai-select-arrow {
      font-size: 10px; color: #4a5568; flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ai-select.open .ai-select-arrow { transform: rotate(180deg); color: #90cdf4; }
    .ai-select-drop {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: #161b27; border: 1px solid rgba(99,179,237,0.2);
      border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      padding: 4px; z-index: 10; display: none; overflow-y: auto;
      max-height: 200px; scrollbar-width: thin;
    }
    .ai-select.open .ai-select-drop {
      display: block; animation: ai-drop-in 0.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes ai-drop-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ai-select-opt {
      padding: 7px 10px; border-radius: 7px; color: #c5d0e0; font-size: 12px;
      cursor: pointer; transition: background 0.15s, color 0.15s, padding-left 0.2s;
    }
    .ai-select-opt:hover {
      background: rgba(99,179,237,0.1); color: #90cdf4; padding-left: 14px;
    }
    .ai-select-opt.selected {
      background: rgba(99,179,237,0.08); color: #63b3ed; font-weight: 600;
    }
  </style>
</head>
<body>

<div class="hd">
  <div class="hd-logo">AI</div>
  <div class="hd-info">
    <h1>AI 划词翻译</h1>
    <p>OpenAI 兼容接口 · 自定义配置</p>
  </div>
  <div class="hd-status" id="save-status">✓ 已自动保存</div>
</div>

<div class="bd">

  <!-- 翻译面板快捷入口 -->
  <div class="panel-launch">
    <div class="panel-launch-row">
      <button class="btn-panel" id="btn-open-panel">⌨ 打开翻译面板</button>
      <span class="shortcut-hint">快捷键 <kbd>Alt+Shift+T</kbd></span>
    </div>
    <div class="hint">可在 <span class="link-like" id="link-shortcuts">chrome://extensions/shortcuts</span> 中自定义快捷键</div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>API 地址 <span class="badge">BASE URL</span></label>
    <input type="text" id="apiBase" placeholder="https://api.openai.com" />
    <div class="hint">支持任意 OpenAI 兼容接口，留空使用 OpenAI 官方地址</div>
    <div class="preset-row">
      <button class="preset-btn" data-url="https://api.openai.com" data-model="gpt-4o-mini">OpenAI</button>
      <button class="preset-btn" data-url="https://api.deepseek.com" data-model="deepseek-chat">DeepSeek</button>
      <button class="preset-btn" data-url="https://api.groq.com/openai" data-model="llama-3.3-70b-versatile">Groq</button>
      <button class="preset-btn" data-url="https://generativelanguage.googleapis.com/v1beta/openai" data-model="gemini-2.0-flash">Gemini</button>
    </div>
  </div>

  <div class="field">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
  </div>

  <div class="field">
    <div class="field-label-row">
      <label>模型选择</label>
      <button type="button" class="btn-fetch-models" id="btn-fetch-models">⚡ 获取模型列表</button>
    </div>
    <div id="model-mount"></div>
    <div class="hint">默认显示当前模型，点击「获取模型列表」可刷新该提供商的所有可用模型</div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>翻译窗口关闭方式</label>
    <div class="radio-group">
      <label class="radio-opt">
        <input type="radio" name="dismissMode" value="scroll" />
        <span class="radio-box">
          <span class="radio-icon">↕</span>
          <span class="radio-text">
            <strong>滚动即关闭</strong>
            <em>页面滚动时自动关闭翻译窗口</em>
          </span>
        </span>
      </label>
      <label class="radio-opt">
        <input type="radio" name="dismissMode" value="click" />
        <span class="radio-box">
          <span class="radio-icon">✕</span>
          <span class="radio-text">
            <strong>点击其他处关闭</strong>
            <em>滚动时保持翻译窗口，点击空白处才关闭</em>
          </span>
        </span>
      </label>
    </div>
  </div>

  <div class="field">
    <label>划词翻译目标语言</label>
    <div id="targetLang-mount"></div>
    <div class="hint">页面划词翻译时默认的目标语言（与翻译面板独立互不干扰）</div>
  </div>

  <div class="field">
    <label>面板模式 <span class="badge">MODE</span></label>
    <div class="radio-group">
      <label class="radio-opt">
        <input type="radio" name="panelMode" value="modal" />
        <span class="radio-box">
          <span class="radio-icon">⊞</span>
          <span class="radio-text">
            <strong>模态框</strong>
            <em>背景遮罩，固定居中，不可拖动</em>
          </span>
        </span>
      </label>
      <label class="radio-opt">
        <input type="radio" name="panelMode" value="floating" />
        <span class="radio-box">
          <span class="radio-icon">⊟</span>
          <span class="radio-text">
            <strong>浮动窗口</strong>
            <em>无遮罩，可拖动，可选中页面文字</em>
          </span>
        </span>
      </label>
    </div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>面板尺寸 <span class="badge">PX</span></label>
    <div style="display:flex;gap:8px;">
      <input type="number" id="panelWidth" placeholder="680" min="400" max="1200" style="flex:1;" />
      <span style="color:#4a5568;align-self:center;">×</span>
      <input type="number" id="panelHeight" placeholder="160" min="80" max="500" style="flex:1;" />
    </div>
    <div class="hint">面板宽度 × 单个输入框高度（px），实时保存</div>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="languages.js"></script>
<script src="popup.js"></script>
</body>
</html>
